name: noteos-sync-foundation-test
services:
  web:
    image: noteos-web-phase081
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NOTEOS_SYNC_ENABLED: "1"
      NOTEOS_SYNC_TEST_ONLY: "1"
      NOTEOS_SYNC_STORAGE: /var/lib/noteos-sync
      NOTEOS_SYNC_ALLOWED_ORIGINS: http://127.0.0.1:15720,http://localhost:15720,https://localhost:15721
    ports:
      - "127.0.0.1:15720:3000"
    volumes:
      - synthetic_sync:/var/lib/noteos-sync
      - ./spikes/phase-00/gate1/web/scripts/sync-foundation-fixture.mjs:/verification/fixture.mjs:ro
      - ./spikes/phase-00/gate1/web/scripts/sync-foundation-fixtures.mjs:/verification/sync-foundation-fixtures.mjs:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  synthetic_sync:
    name: noteos_phase081_synthetic_20261022
