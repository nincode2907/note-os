<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f7f5f0; color: #202019; font: 17px/1.62 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-text-size-adjust: 100%; }
    body { overflow: hidden; }
    #noteos-editor { min-height: 240px; padding: 0 20px 28px; }
    .toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 9px 0 13px; background: #f7f5f0; border-bottom: 1px solid #dedbd2; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .toolbar button { flex: 0 0 auto; min-width: 42px; height: 40px; padding: 0 11px; border: 1px solid #dedbd2; border-radius: 12px; background: #fffefa; color: #344d3f; font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; }
    .toolbar button:disabled { opacity: .42; }
    .toolbar button:active { background: #e7eee8; }
    #save-state { min-height: 23px; color: #6f705f; font-size: 12px; padding-top: 7px; }
    #error { margin: 14px 0; padding: 12px; border: 1px solid #bb765e; border-radius: 12px; color: #773f32; background: #fff8f4; white-space: pre-wrap; }
    #editable { min-height: 170px; outline: none; padding: 18px 0 8px; overflow-wrap: anywhere; caret-color: #344d3f; }
    #editable > *:first-child { margin-top: 0; }
    #editable p { margin: 0 0 1em; }
    #editable h1, #editable h2, #editable h3, #editable h4, #editable h5, #editable h6 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; margin: 1.05em 0 .5em; }
    #editable h1 { font-size: 1.8em; } #editable h2 { font-size: 1.5em; } #editable h3 { font-size: 1.3em; }
    #editable ul, #editable ol { padding-left: 1.5em; margin: .55em 0 1em; }
    #editable ul[data-type="taskList"] { list-style: none; padding-left: .2em; }
    #editable li { padding-left: .2em; }
    #editable li p { margin: .15em 0; }
    #editable li[data-type="taskItem"] { display: flex; align-items: flex-start; gap: 9px; }
    #editable li[data-type="taskItem"] > label { flex: 0 0 auto; padding-top: 2px; }
    #editable li[data-type="taskItem"] > div { flex: 1; min-width: 0; }
    #editable li[data-type="taskItem"] input { width: 18px; height: 18px; accent-color: #344d3f; }
    #editable blockquote { border-left: 3px solid #9ba793; margin: .9em 0; padding-left: 15px; color: #55594e; }
    #editable pre { white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 12px; padding: 13px; background: #eae8e0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #editable code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: #eae8e0; border-radius: 4px; padding: .08em .24em; }
    #editable pre code { padding: 0; background: transparent; }
    #editable a { color: #345d72; text-decoration: underline; text-underline-offset: 2px; }
    #editable hr { border: 0; border-top: 1px solid #dedbd2; }
    .noteos-attachment-reference { display: inline-block; border: 1px solid #c5c8bc; color: #465646; border-radius: 5px; padding: 0 5px; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main id="noteos-editor">
    <nav class="toolbar" aria-label="Formatting">
      <button data-command="bold" aria-label="Bold"><b>B</b></button><button data-command="italic" aria-label="Italic"><i>I</i></button><button data-command="strike" aria-label="Strikethrough"><s>S</s></button>
      <button data-command="heading" data-level="1" aria-label="Heading">H1</button><button data-command="heading" data-level="2" aria-label="Subheading">H2</button>
      <button data-command="bullet" aria-label="Bulleted list">• List</button><button data-command="ordered" aria-label="Numbered list">1. List</button><button data-command="task" aria-label="Task list">☑ Task</button>
      <button data-command="quote" aria-label="Block quote">❝</button><button data-command="code" aria-label="Code block">{ }</button><button data-command="link" aria-label="Add link">↗ Link</button>
    </nav>
    <div id="save-state" aria-live="polite"></div>
    <div id="error" role="alert" hidden></div>
    <div id="editable" role="textbox" aria-multiline="true" aria-label="Note body"></div>
  </main>
  <script>__EDITOR_SCRIPT__</script>
</body>
</html>
