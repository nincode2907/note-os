name: noteos

services:
  web:
    build:
      context: ./spikes/phase-00/gate1/web
      dockerfile: Dockerfile
    image: noteos-web-local
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NOTEOS_SYNC_ENABLED: "0"
      NOTEOS_SYNC_STORAGE: /var/lib/noteos-sync
      NOTEOS_SYNC_ALLOWED_ORIGINS: ""
    volumes:
      - noteos_sync:/var/lib/noteos-sync
    ports:
      - "127.0.0.1:${NOTEOS_WEB_PORT:-15700}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  noteos_sync:
